       <!-- 전화거는 a 태그의 경우 페이지를 넘기는 것도 아니라 전화를 거는 것이라 데이터수집이 안됩, 전화걸기가 얼마나 많이 실행되었는지 수집을  위해 전화걸기전에 데이터수집 후 실행되도록 골백함수로 처리 -->

        <a href="tel:01071281041"  onclick="trackAndCall(event, '01071281041')">전화걸기</a>
            <script type="text/javascript">
                function trackAndCall(event, phoneNumber) {                   
                    event.preventDefault();                  
                    if (window.wcs) {
                        wcs.inflow("https://4thdraw.github.io/4thdraw/"); 
                        var _conv = {};
                        _conv.type = "custom001"; 
                        wcs.trans(_conv); 
                    }                  
                    setTimeout(() => {
                        window.location.href = `tel:${phoneNumber}`;
                    }, 500); 
                }
            </script>
